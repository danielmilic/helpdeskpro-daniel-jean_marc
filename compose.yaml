services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - helpdesk-data:/var/lib/postgresql/data
    networks:
      - helpdesk-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    image: helpdesk-api:0.1.0
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk-net

  worker:
    build: ./worker
    image: helpdesk-worker:0.1.0
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk-net

volumes:
  helpdesk-data:

networks:
  helpdesk-net:
