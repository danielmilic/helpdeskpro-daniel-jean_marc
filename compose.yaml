services:
db:
image: postgres:16-alpine
environment:
POSTGRES_USER: ${POSTGRES_USER}
POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
POSTGRES_DB: ${POSTGRES_DB}
volumes:
- db-data:/var/lib/postgresql/data
networks: [backend]
api:
build: ./api
environment:
DATABASE_URL: ${DATABASE_URL}
ports:
- "${API_PORT:-3000}:3000"
depends_on: [db]
networks: [backend]
